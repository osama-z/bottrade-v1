[pytest]
testpaths = tests
markers =
    integration: real network / Binance-testnet tests. Opt-in — skipped by
        default (addopts below); run explicitly with `pytest -m integration`.
# Fast unit suite by default: integration (real-network) tests are excluded so
# CI and local runs stay hermetic and offline. Run the real tests on demand:
#   pytest -m integration
addopts = -m "not integration"
